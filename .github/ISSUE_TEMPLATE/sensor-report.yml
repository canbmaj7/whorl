name: Sensor report
description: Tell us whether your fingerprint reader works on Linux (this grows the catalog)
title: "[sensor] <vendor:product> on <laptop model>"
labels: ["sensor-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please do not paste fingerprint data, key files or anything from `/var/lib/fprint`.
  - type: input
    id: usb-id
    attributes:
      label: Sensor id
      description: "The vendor:product from `lsusb`, e.g. 27c6:5125"
    validations:
      required: true
  - type: textarea
    id: lsusb
    attributes:
      label: lsusb line
      render: text
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Laptop / device model
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      description: e.g. Arch/CachyOS + KDE Plasma 6
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works with upstream libfprint
        - Works with a community driver
        - Detected but does not work
        - Not detected / no driver known
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What did you try?
      description: Output of `fprintd-list $USER`, driver or fork used, errors, anything surprising (e.g. the sensor already held a key).
    validations:
      required: true
